name: HaloNotch
options:
  bundleIdPrefix: com.ethanstrauss
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"           # Swift 5 language mode = far fewer strict-concurrency errors on Xcode 26
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    PRODUCT_NAME: HaloNotch
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"        # ad-hoc local signing
    CODE_SIGNING_REQUIRED: "NO"
    ENABLE_HARDENED_RUNTIME: "NO"  # keep local dev friction-free
    DEAD_CODE_STRIPPING: "YES"

targets:
  HaloNotch:
    type: application
    platform: macOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ethanstrauss.halonotch
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
    info:
      path: Sources/Resources/Info.plist
      properties:
        CFBundleName: HaloNotch
        CFBundleDisplayName: HaloNotch
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "14.0"
        # Menu-bar agent: no Dock icon, no main window
        LSUIElement: true
        # Permission prompts (only shown when the relevant module is first used)
        NSCalendarsUsageDescription: "HaloNotch shows your upcoming events in the notch."
        NSCalendarsFullAccessUsageDescription: "HaloNotch shows your upcoming events in the notch."
        NSAppleEventsUsageDescription: "HaloNotch controls Spotify and Apple Music playback from the notch."
        NSCameraUsageDescription: "HaloNotch turns the notch into a mirror using the built-in camera."
        # Quiet the default about-panel
        NSHumanReadableCopyright: "Built by Ethan Strauss"
